<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messier Trainer — Flashcards</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #0b0d12; color: #eef2ff; }
    .app { max-width: 1000px; margin: 0 auto; padding: 22px 20px 48px; }
    .header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
    h1 { margin: 0 0 5px; font-size: 28px; }
    .muted { color: #99a5be; font-size: 14px; }
    .controls, .actions { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
    select, button, .link { background: #1a2232; color: #eef2ff; border: 1px solid #2a3550; border-radius: 10px; padding: 10px 13px; font-size: 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
    select { background: #0d121b; }
    .primary { background: #4b74ff; border-color: #4b74ff; }
    .card { background: #11151f; border: 1px solid #20273a; border-radius: 15px; overflow: hidden; }
    .card-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 15px; border-bottom: 1px solid #20273a; }
    .study-row { padding: 12px; }
    .flashcard-frame { position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 10px; overflow: hidden; background: #05070b; border: 1px solid #283148; }
    .photo { position: absolute; inset: 0; background: #05070b; cursor: pointer; overflow: hidden; }
    .photo img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .placeholder { height: 100%; display: flex; align-items: center; justify-content: center; color: #8d98ae; padding: 25px; text-align: center; }
    .tap-hint { position: absolute; left: 50%; bottom: 15px; transform: translateX(-50%); padding: 8px 13px; border-radius: 20px; background: rgba(5,7,11,.82); border: 1px solid #52607c; font-size: 13px; white-space: nowrap; }
    .answer { position: absolute; inset: 0; z-index: 3; padding: 22px; background: linear-gradient(145deg, #111a2b, #090d15); overflow-y: auto; cursor: pointer; }
    .answer.hidden { display: none; }
    .answer h2 { margin: 0 0 13px; font-size: 25px; }
    .details { display: grid; grid-template-columns: 120px 1fr; gap: 8px 12px; line-height: 1.5; }
    .label { color: #9aa6bf; font-weight: 700; }
    .description { margin-top: 14px; color: #cbd3e5; line-height: 1.55; }
    .sky-panel { min-width: 0; margin-top: 16px; padding-top: 15px; border-top: 1px solid #20273a; }
    .sky-panel h2 { margin: 0 0 5px; font-size: 18px; }
    .sky-map { width: 100%; aspect-ratio: 16/7; margin-top: 8px; border-radius: 10px; overflow: hidden; background: #05070b; border: 1px solid #283148; }
    .sky-map img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .sky-map svg { width: 100%; height: 100%; display: block; }
    @media (max-width: 760px) { h1 { font-size: 24px; } .details { grid-template-columns: 95px 1fr; } .sky-map { aspect-ratio: 16/10; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div><h1>Messier Flashcards</h1><div class="muted">Study the image, then tap it to reveal the answer.</div></div>
      <div class="actions"><a class="link" href="index.html">Trainer</a><a class="link" href="stats.html">Statistics</a></div>
    </header>

    <div class="controls" style="margin-bottom:14px">
      <label for="categorySelect" class="muted">Category:</label>
      <select id="categorySelect"></select>
      <button id="shuffleBtn">Shuffle cards</button>
    </div>

    <section class="card">
      <div class="card-top">
        <div><strong id="progress">0 / 0</strong> <span class="muted" id="categoryLabel"></span></div>
        <div class="actions"><button id="prevBtn">← Previous</button><button class="primary" id="nextBtn">Next →</button></div>
      </div>
      <div class="study-row">
        <div class="flashcard-frame">
          <div class="photo" id="photo" role="button" tabindex="0" aria-label="Reveal flashcard answer">
            <div class="placeholder">Loading image...</div>
            <div class="tap-hint">Tap image to reveal answer</div>
          </div>
          <div class="answer hidden" id="answer" role="button" tabindex="0" aria-label="Return to image"></div>
        </div>
        <section class="sky-panel">
          <h2>Where it is on the sky</h2>
          <div class="muted">Blue: constellation figures · Orange: constellation boundaries</div>
          <div class="sky-map" id="skyMap"></div>
        </section>
      </div>
    </section>
  </main>

  <script src="user-profile.js"></script>
  <script src="sky-data.js"></script>
  <script src="sky-map.js"></script>
  <script>
    const CURRENT_USERNAME = MessierUser.getCurrent();
    MessierUser.mount(CURRENT_USERNAME);
    const CATEGORY_STORAGE_KEY = MessierUser.storageKey("messier-trainer-categories-v1", CURRENT_USERNAME);
    const anatolieDefaultNumbers = [1,3,13,15,29,31,32,33,34,36,37,38,39,40,45,51,52,53,56,57,63,64,74,76,81,82,85,88,91,92,94,97,98,99,100,101,102,103,106,108,109,110];
    const typeGroups = {
      "Nebula": [1,8,16,17,20,27,42,43,57,76,78,97],
      "Open cluster": [6,7,11,18,21,23,25,26,29,34,35,36,37,38,39,41,44,45,46,47,48,50,52,67,93,103],
      "Globular cluster": [2,3,4,5,9,10,12,13,14,15,19,22,28,30,53,54,55,56,62,68,69,70,71,72,75,79,80,92,107],
      "Other / Double star": [40], "Other / Star cloud / Asterism": [24,73]
    };
    const typeMap = new Map();
    Object.entries(typeGroups).forEach(([type, numbers]) => numbers.forEach(number => typeMap.set(number, type)));
    const objects = Array.from({length:110}, (_, index) => ({ messier:index+1, page:`Messier ${index+1}`, type:typeMap.get(index+1) || "Galaxy" }));
    let categories;
    try { categories = JSON.parse(localStorage.getItem(CATEGORY_STORAGE_KEY)); } catch (error) {}
    if (!categories) categories = { Anatolie: anatolieDefaultNumbers, ALL: objects.map(object => object.messier) };
    categories.ALL = objects.map(object => object.messier);

    const categorySelect = document.getElementById("categorySelect");
    const photo = document.getElementById("photo");
    const answer = document.getElementById("answer");
    const imageCache = new Map();
    const localCatalog = fetch("data/messier.json").then(response => {
      if (!response.ok) throw new Error("Local Messier catalog unavailable");
      return response.json();
    }).catch(() => ({}));
    let cards = [];
    let index = 0;
    let revealed = false;

    function shuffle(items) {
      const result = [...items];
      for (let i=result.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [result[i],result[j]]=[result[j],result[i]]; }
      return result;
    }

    function constellationFrom(text) {
      const match = (text || "").match(/(?:in|within) the constellation(?: of)? ([A-Za-z -]+?)[\.,]/i);
      return match ? match[1].trim() : "Unknown";
    }

    async function wikipedia(page, messier) {
      if (imageCache.has(page)) return imageCache.get(page);
      const local = (await localCatalog)[messier] || {};
      let remote = {};
      if (!local.extract) {
        try {
          const response = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(page)}`);
          if (response.ok) remote = await response.json();
        } catch (error) {}
      }
      const result = {
        title:local.title || remote.title || page,
        image:local.image || `images/messier/m${messier}.jpg`,
        extract:local.extract || remote.extract || ""
      };
      imageCache.set(page, result);
      return result;
    }

    function showLocalImage(data, messier) {
      photo.innerHTML = "";
      const image = document.createElement("img");
      image.alt = data.title || `Messier ${messier}`;
      const candidates = [data.image, `images/messier/m${messier}.jpg`, `images/messier/m${messier}.png`, `images/messier/m${messier}.webp`]
        .filter((value, position, list) => value && list.indexOf(value) === position);
      let candidateIndex = 0;
      image.addEventListener("error", () => {
        candidateIndex += 1;
        if (candidateIndex < candidates.length) image.src = candidates[candidateIndex];
        else photo.innerHTML = '<div class="placeholder">Image unavailable. Tap to reveal.</div>';
      });
      photo.appendChild(image);
      const hint = document.createElement("div");
      hint.className = "tap-hint";
      hint.textContent = "Tap image to reveal answer";
      photo.appendChild(hint);
      image.src = candidates[0];
    }

    async function showCard() {
      revealed = false;
      answer.classList.add("hidden");
      answer.innerHTML = "";
      if (!cards.length) {
        document.getElementById("progress").textContent = "0 / 0";
        photo.innerHTML = '<div class="placeholder">This category is empty.</div>';
        document.getElementById("skyMap").innerHTML = '<div class="placeholder">Add objects to this category in the trainer.</div>';
        return;
      }
      const object = cards[index];
      document.getElementById("progress").textContent = `${index+1} / ${cards.length}`;
      document.getElementById("categoryLabel").textContent = categorySelect.value;
      photo.innerHTML = '<div class="placeholder">Loading image...</div><div class="tap-hint">Tap image to reveal answer</div>';
      loadSkyMap(object.messier);
      try {
        const data = await wikipedia(object.page, object.messier);
        showLocalImage(data, object.messier);
        answer.innerHTML = `<h2>M${object.messier} — ${data.title}</h2><div class="details"><div class="label">Type</div><div>${object.type}</div><div class="label">Constellation</div><div>${constellationFrom(data.extract)}</div></div><div class="description">${data.extract || "No description available."}</div>`;
      } catch (error) {
        photo.innerHTML = '<div class="placeholder">Image could not be loaded. Tap to reveal.</div>';
        answer.innerHTML = `<h2>M${object.messier}</h2><div class="details"><div class="label">Type</div><div>${object.type}</div></div>`;
      }
    }

    function reveal() { if (!cards.length) return; revealed = !revealed; answer.classList.toggle("hidden", !revealed); }

    function loadSkyMap(messier) {
      MessierSkyMap.render(document.getElementById("skyMap"), messier);
    }

    function selectCategory() {
      const selected = new Set(categories[categorySelect.value] || []);
      cards = objects.filter(object => selected.has(object.messier));
      index = 0;
      showCard();
    }

    categorySelect.innerHTML = Object.keys(categories).map(name => `<option value="${name}">${name} (${categories[name].length})</option>`).join("");
    categorySelect.addEventListener("change", selectCategory);
    document.getElementById("shuffleBtn").addEventListener("click", () => { cards=shuffle(cards); index=0; showCard(); });
    document.getElementById("nextBtn").addEventListener("click", () => { if(cards.length){index=(index+1)%cards.length;showCard();} });
    document.getElementById("prevBtn").addEventListener("click", () => { if(cards.length){index=(index-1+cards.length)%cards.length;showCard();} });
    photo.addEventListener("click", reveal);
    photo.addEventListener("keydown", event => { if(event.key === "Enter" || event.key === " "){event.preventDefault();reveal();} });
    answer.addEventListener("click", reveal);
    answer.addEventListener("keydown", event => { if(event.key === "Enter" || event.key === " "){event.preventDefault();reveal();} });
    selectCategory();
  </script>
</body>
</html>
